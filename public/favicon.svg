<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48" fill="none">
  <defs>
    <radialGradient id="halo" cx="42%" cy="38%" r="62%">
      <stop offset="0%" stop-color="#94efed" stop-opacity="0.9"/>
      <stop offset="55%" stop-color="#00c1bf" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#00c1bf" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="stroke" x1="8" y1="8" x2="40" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00c1bf"/>
      <stop offset="100%" stop-color="#008280"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="1.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- glow halo behind the lens -->
  <circle cx="20" cy="20" r="17" fill="url(#halo)"/>
  <g filter="url(#soft)">
    <!-- lens ring -->
    <circle cx="20" cy="20" r="13" stroke="url(#stroke)" stroke-width="3.6" fill="#ecfbfb"/>
    <!-- handle -->
    <path d="M30 30l10 10" stroke="url(#stroke)" stroke-width="4.2" stroke-linecap="round"/>
    <!-- connected forwarder nodes inside the lens -->
    <path d="M15 17l10 0M15 17l5 8M25 17l-5 8" stroke="#008280" stroke-width="1.7" opacity="0.6"/>
    <circle cx="15" cy="17" r="2.5" fill="#00bfbd"/>
    <circle cx="25" cy="17" r="2.5" fill="#00bfbd"/>
    <circle cx="20" cy="25" r="2.5" fill="#00bfbd"/>
  </g>
</svg>
